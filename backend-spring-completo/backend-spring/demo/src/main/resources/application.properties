spring.application.name=demo
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Banco de dados (container PostgreSQL)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inspecao}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# update cria/ajusta as tabelas na subida (nao apaga dados). Em producao prefira Flyway + validate.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# ESP8266 NodeMCU ESP-12E (co-processador de I/O via USB Serial) - firmware "mesa-de-lorenzo"
# Protocolo do firmware: texto a 115200 bps, uma linha por comando. Comando de rejeicao: "NOK\n"
# (aciona a saida do cilindro pelo tempo fixo do firmware, TEMPO_NOK_MS = 5000 ms, e desarma sozinho).
# O firmware nao envia estado de sensor: a leitura de entrada nao e usada (ver inspecao.polling-habilitado).
# Pinagem do firmware: saida de rejeicao no D1 (GPIO5); D1/D2 sao SCL/SDA nesta placa.
# ---------------------------------------------------------------------------
# true = ESP simulado em memoria (sem hardware): ver README / POST /api/simulacao/sensor
esp.simulado=${ESP_SIMULADO:false}
# Porta serial do ESP. Linux/Raspberry Pi: normalmente /dev/ttyUSB0 (chip CP2102/CH340),
# as vezes /dev/ttyACM0 conforme a placa. Windows (dev local): COM3, COM4, etc.
esp.porta=${ESP_PORTA:/dev/ttyUSB0}
esp.baud-rate=${ESP_BAUD_RATE:115200}
# Intervalo entre tentativas de reconexao quando a porta nao responde (ESP desconectado/resetado)
esp.intervalo-reconexao=3s
# Tempo (ms) que o cilindro fica avancado antes do retorno automatico. Valor INICIAL da
# "variavel global" - depois de subir, ajuste em runtime via GET/PUT /api/atuador/configuracao.
esp.tempo-acionamento-inicial-ms=${ESP_TEMPO_ACIONAMENTO_MS:5000}
# Enderecos de bit usados hoje (entrada e saida sao namespaces separados no protocolo)
esp.endereco-sensor-capacitivo=${ESP_ENDERECO_SENSOR:0}
esp.endereco-cilindro-rejeicao=${ESP_ENDERECO_CILINDRO:0}

# ---------------------------------------------------------------------------
# Inspecao (orquestracao Arduino (sensor) -> camera -> IA -> Arduino (cilindro))
# ---------------------------------------------------------------------------
# false: o firmware atual nao envia estado do sensor capacitivo
inspecao.polling-habilitado=${INSPECAO_POLLING:false}
inspecao.intervalo-polling=PT0.1S
inspecao.debounce=500ms
# Tempo entre o SENSOR detectar a peca e o cilindro atuar (inclui camera + IA). CALIBRAR NA MESA.
inspecao.atraso-atuacao=${INSPECAO_ATRASO_ATUACAO:4s}
# Se a camera/IA falhar, a peca e desviada como recusada (fail-safe)?
inspecao.falha-reprova=true
inspecao.esteira-id=${INSPECAO_ESTEIRA_ID:1}
inspecao.nome-esteira-padrao=Linha Principal 01
inspecao.pasta-imagens=${INSPECAO_PASTA_IMAGENS:./storage/recusadas}
inspecao.fila-maxima=10

# ---------------------------------------------------------------------------
# API de IA (ia-modelo/main.py - FastAPI)
# ---------------------------------------------------------------------------
ia.base-url=${IA_BASE_URL:http://localhost:8000}
ia.timeout-conexao=3s
ia.timeout-leitura=15s

# ---------------------------------------------------------------------------
# Camera USB (captura via ffmpeg / v4l2)
# ---------------------------------------------------------------------------
camera.dispositivo=${CAMERA_DEVICE:/dev/video0}
camera.ffmpeg=${FFMPEG_PATH:ffmpeg}
camera.resolucao=640x480
camera.frames-descartados=5
camera.timeout=10s
# Desenvolvimento sem camera: arquivo de imagem OU pasta (sorteia uma imagem a cada captura)
camera.imagem-simulada=${CAMERA_IMAGEM_SIMULADA:}

# ---------------------------------------------------------------------------
# Seguranca (token Bearer). Perfis: OPERADOR e ADMIN.
# ---------------------------------------------------------------------------
seguranca.habilitada=${SEGURANCA_HABILITADA:true}
# minimo 32 caracteres; vazio = aleatorio a cada subida
seguranca.segredo=${SEGURANCA_SEGREDO:}
seguranca.validade-token=8h
seguranca.admin-email=${ADMIN_EMAIL:admin@local}
seguranca.admin-nome=${ADMIN_NOME:Administrador}
# vazio = senha aleatoria escrita no log na primeira subida
seguranca.admin-senha=${ADMIN_SENHA:}
seguranca.login-tentativas-max=5
seguranca.login-janela=5m

# ---------------------------------------------------------------------------
# CORS (App React Native / dashboard)
# ---------------------------------------------------------------------------
app.cors.origens-permitidas=${CORS_ORIGENS:*}
